<!doctype html>
<html lang="ru">
  <head>
    <script>
      // Apply the saved theme, or the system one, before the first paint.
      (function () {
        try {
          var stored = localStorage.getItem("nandch-theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme =
            stored === "light" || stored === "dark" ? stored : light && !dark ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Zuvlul помогает компании выбрать фильм, место, игру или что угодно ещё."
    />
    <title>Zuvlul</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
